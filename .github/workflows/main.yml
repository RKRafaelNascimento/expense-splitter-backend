name: "Github Actions Pipeline"

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: NodeJS Setup
        uses: actions/setup-node@v3
        with:
          node-version: "18.x"

      - name: Installing Dependecies
        run: npm install
